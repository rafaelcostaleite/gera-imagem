version: '3.8'

services:
  web:
    build: .
    container_name: gera-imagem-app
    ports:
      - "5000:5000"
    volumes:
      # Montar código para desenvolvimento (opcional - comentar em produção)
      - .:/app
      # Volumes persistentes para uploads e output
      - uploads-data:/app/uploads
      - output-data:/app/output
    environment:
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  uploads-data:
  output-data:
