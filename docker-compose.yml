version: '3.8'

services:
  # Banco de dados PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: it-cases-db
    environment:
      POSTGRES_DB: it_cases
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - it-cases-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Python (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: it-cases-backend
    environment:
      DATABASE_URL: postgresql://admin:admin123@db:5432/it_cases
      SECRET_KEY: your-secret-key-change-in-production
      AD_SERVER: ldap://your-ad-server.com
      AD_DOMAIN: your-domain.com
      AD_BASE_DN: DC=your-domain,DC=com
      DEVELOPMENT_MODE: "True"
      DEV_DEFAULT_PASSWORD: "123456"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    networks:
      - it-cases-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: it-cases-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - it-cases-network
    depends_on:
      - backend
    restart: unless-stopped
    stdin_open: true
    tty: true

networks:
  it-cases-network:
    driver: bridge

volumes:
  postgres_data:
